name: SteadyMD
description: 'SteadyMD is a telehealth infrastructure and clinical-workforce company (a DocGo company)
  backed by Lux Capital. It supplies board-certified physicians and nurse practitioners, clinical
  operations, and 50-state licensing and credentialing, plus technology and telehealth APIs that let
  healthcare and digital-health partners launch branded, fully managed virtual care. Its APIs cover
  patient data submission, synchronous and asynchronous consult requests, two-way patient-clinician
  messaging, intake forms, clinician availability, real-time status updates, document attachments,
  scheduling, and reporting/SLA retrieval, offered as either a Limited (partner-EMR) or Complete
  (SteadyMD-EMR) integration. API documentation is provided under a business agreement via a request
  form; there is no public developer portal or OpenAPI at this time.'
